<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sinyal Üreteci</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Düzen: telefonda tek sütun (grafikler üstte, ayarlar altta, çal düğmesi altta yapışık); geniş ekranda grafik solda, ayarlar sağda. */
:root {
  --bg: #edf1f1;
  --surface: #ffffff;
  --ink: #132120;
  --muted: #566867;
  --line: #cbd6d5;
  --trace: #0a7a74;
  --trace2: #b4531a;
  --on-accent: #ffffff;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1514; --surface: #172120; --ink: #e5eeed; --muted: #8fa3a1; --line: #2a3836;
    --trace: #3fd0c4; --trace2: #f0a45f; --on-accent: #052120; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #172120; --ink: #e5eeed; --muted: #8fa3a1; --line: #2a3836;
  --trace: #3fd0c4; --trace2: #f0a45f; --on-accent: #052120; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-inline: 16px; padding-block: 18px 0;
}
.app { max-width: 1040px; margin-inline: auto; display: grid; gap: 18px; }
header h1 { font: 700 28px/1.1 var(--f-display); letter-spacing: -0.01em; margin: 0 0 4px; text-wrap: balance; }
header p { margin: 0; color: var(--muted); }
.plots { display: grid; gap: 14px; min-width: 0; align-content: start; }
.plot { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 10px 8px; min-width: 0; }
.plot figcaption { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
canvas { display: block; width: 100%; height: 210px; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font: 400 12.5px var(--f-mono); color: var(--muted); padding-top: 6px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); font: 500 12px var(--f-body); padding: 5px 10px; letter-spacing: 0.04em; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.panel { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.types, .presets { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 14px var(--f-body); padding: 0 12px; min-height: 40px; border-radius: 6px; cursor: pointer; }
.chip[aria-checked="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.preset { min-height: 34px; font-size: 13px; color: var(--muted); }
.preset b { font-family: var(--f-mono); font-weight: 500; color: var(--ink); margin-right: 4px; }
#controls { display: grid; gap: 12px; }
.row { display: grid; gap: 2px; }
.row-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.row label, .row .lbl { font-size: 13px; color: var(--muted); }
.val { font: 500 13px var(--f-mono); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; height: 30px; accent-color: var(--trace); margin: 0; }
.fnum { display: inline-flex; align-items: center; gap: 6px; }
.fnum input { width: 6.5rem; font: 500 14px var(--f-mono); padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); text-align: right; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; min-height: 32px; }
.check input { width: 18px; height: 18px; accent-color: var(--trace); }
.dock { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.dock-row { display: flex; align-items: center; gap: 10px; }
.play { flex: 0 0 auto; min-width: 7.5rem; min-height: 46px; border: 0; border-radius: 8px; background: var(--trace); color: var(--on-accent); font: 600 16px var(--f-body); cursor: pointer; }
.vol { flex: 1; display: grid; gap: 0; min-width: 0; }
.vol span { font-size: 12px; color: var(--muted); }
.ghost { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 13px var(--f-body); min-height: 40px; padding: 0 12px; border-radius: 6px; cursor: pointer; }
#csvOut { width: 100%; height: 90px; font: 12px var(--f-mono); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; }
#msg { margin: 0; min-height: 1.3em; font-size: 13px; color: var(--muted); }
.warn { font-size: 12.5px; color: var(--muted); margin: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--trace); outline-offset: 2px; }
@media (min-width: 880px) {
  .app { grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); column-gap: 28px; }
  header { grid-column: 1 / -1; }
  canvas { height: 240px; }
}
</style>

</head>
<body>
<main class="app">
  <header>
    <h1>Sinyal Üreteci</h1>
    <p>Dalga biçimini seç, ayarla; zaman grafiğini ve spektrumunu gör, sesini dinle.</p>
  </header>

  <section class="plots" aria-label="Grafikler">
    <figure class="plot">
      <figcaption><span>Zaman bölgesi</span><span id="viewInfo"></span></figcaption>
      <canvas id="cTime" aria-label="Zaman bölgesi grafiği"></canvas>
      <div class="stats" id="stats"></div>
    </figure>
    <figure class="plot">
      <figcaption>
        <span>Spektrum (FFT)</span>
        <span class="seg" role="group" aria-label="Frekans ekseni">
          <button id="axLog" aria-pressed="true">Log</button>
          <button id="axLin" aria-pressed="false">Doğrusal</button>
        </span>
      </figcaption>
      <canvas id="cSpec" aria-label="Frekans spektrumu grafiği"></canvas>
      <div class="stats" id="specStats"></div>
    </figure>
  </section>

  <section class="panel" aria-label="Ayarlar">
    <div class="types" id="types" role="radiogroup" aria-label="Sinyal türü"></div>
    <div class="presets" id="presets"></div>
    <div id="controls"></div>
    <div class="dock">
      <div class="dock-row">
        <button class="play" id="play" aria-pressed="false">Çal</button>
        <div class="vol">
          <span>Ses seviyesi</span>
          <input type="range" id="vol" min="0" max="1" step="0.01" value="0.25" aria-label="Ses seviyesi">
        </div>
        <button class="ghost" id="copy">CSV kopyala</button>
      </div>
      <textarea id="csvOut" hidden readonly aria-label="CSV verisi"></textarea>
      <p id="msg" role="status">Önce ses seviyesini düşük tut, sonra Çal'a bas.</p>
    </div>
  </section>
</main>

<script>
(function () {
  var FS = 44100, N_SPEC = 32768;
  var TYPES = [['sinus','Sinüs'],['kare','Kare'],['ucgen','Üçgen'],['testere','Testere'],['darbe','Darbe'],['gurultu','Gürültü'],['chirp','Chirp'],['am','AM'],['fm','FM']];
  var PRESETS = [[50,'50 Hz','şebeke'],[440,'440 Hz','La'],[1000,'1 kHz','test']];
  var P = { tur:'sinus', f:440, genlik:0.8, ofset:0, faz:0, duty:0.5, f2:4000, sure:0.5, modf:20, derinlik:0.6, beta:4, snrOn:false, snr:20, vol:0.25, log:true };

  function clamp(v,a,b){ return Math.min(b, Math.max(a, v)); }
  function rng(seed){ var a = seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function gauss(r){ var u=r()||1e-12, v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  function trim(s){ return s.indexOf('.')<0 ? s : s.replace(/0+$/,'').replace(/\.$/,''); }
  function fmtHz(f){ return f>=1000 ? trim((f/1000).toFixed(f>=10000?1:3))+' kHz' : trim(f.toFixed(f<10?2:1))+' Hz'; }
  function fmtT(s){ return s<1 ? trim((s*1000).toFixed(s<0.01?2:1))+' ms' : trim(s.toFixed(2))+' sn'; }

  /* ---------- Sinyal üretimi ---------- */
  function gen(n, fs, seed, noOffset){
    var f=P.f, r=rng(seed), x=new Float32Array(n), tw=2*Math.PI, ph=P.faz*Math.PI/180, i, t, fr, v;
    for (i=0;i<n;i++){
      t=i/fs; fr=f*t+P.faz/360; fr-=Math.floor(fr);
      switch (P.tur){
        case 'sinus': v=Math.sin(tw*f*t+ph); break;
        case 'kare': v=fr<P.duty?1:-1; break;
        case 'ucgen': v=4*Math.abs(fr-0.5)-1; break;
        case 'testere': v=2*fr-1; break;
        case 'darbe': v=fr<P.duty?1:0; break;
        case 'gurultu': v=clamp(gauss(r)/3.5,-1,1); break;
        case 'chirp': v=Math.sin(tw*(f*t+(P.f2-f)/(2*P.sure)*t*t)+ph); break;
        case 'am': v=(1+P.derinlik*Math.sin(tw*P.modf*t))/(1+P.derinlik)*Math.sin(tw*f*t+ph); break;
        default: v=Math.sin(tw*f*t+P.beta*Math.sin(tw*P.modf*t)+ph);
      }
      x[i]=v*P.genlik;
    }
    if (P.snrOn && P.tur!=='gurultu'){
      var s=0; for (i=0;i<n;i++) s+=x[i]*x[i];
      var sd=Math.sqrt(s/n/Math.pow(10,P.snr/10));
      for (i=0;i<n;i++) x[i]+=gauss(r)*sd;
    }
    if (!noOffset) for (i=0;i<n;i++) x[i]+=P.ofset;
    return x;
  }
  function view(){
    var t=P.tur, f=P.f, fs, dur;
    if (t==='gurultu'){ fs=FS; dur=0.01; }
    else if (t==='am'||t==='fm'){ fs=FS; dur=Math.min(2/P.modf,0.45); }
    else if (t==='chirp'){ fs=FS; dur=P.sure; }
    else { fs=clamp(f*200,2000,FS); dur=Math.max(4/f,0.002); }
    return { fs:fs, dur:dur, n:Math.max(64,Math.round(dur*fs)) };
  }

  /* ---------- FFT ---------- */
  var hann=new Float64Array(N_SPEC), sumW=0;
  for (var q=0;q<N_SPEC;q++){ hann[q]=0.5-0.5*Math.cos(2*Math.PI*q/(N_SPEC-1)); sumW+=hann[q]; }
  function fft(re,im){
    var n=re.length,i,j,bit,t,len,k;
    for (i=1,j=0;i<n;i++){ bit=n>>1; for(;j&bit;bit>>=1) j^=bit; j^=bit; if(i<j){ t=re[i];re[i]=re[j];re[j]=t; t=im[i];im[i]=im[j];im[j]=t; } }
    for (len=2;len<=n;len<<=1){
      var ang=-2*Math.PI/len, wr=Math.cos(ang), wi=Math.sin(ang), half=len>>1;
      for (i=0;i<n;i+=len){
        var cr=1,ci=0;
        for (k=0;k<half;k++){
          var a=i+k,b=a+half, xr=re[b]*cr-im[b]*ci, xi=re[b]*ci+im[b]*cr;
          re[b]=re[a]-xr; im[b]=im[a]-xi; re[a]+=xr; im[a]+=xi;
          var nc=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=nc;
        }
      }
    }
  }
  function spectrum(){
    var x=gen(N_SPEC,FS,2,true), re=new Float64Array(N_SPEC), im=new Float64Array(N_SPEC), i;
    for (i=0;i<N_SPEC;i++) re[i]=x[i]*hann[i];
    fft(re,im);
    var half=N_SPEC/2, db=new Float32Array(half+1), pk=1;
    for (i=0;i<=half;i++){
      db[i]=20*Math.log(2*Math.sqrt(re[i]*re[i]+im[i]*im[i])/sumW+1e-12)/Math.LN10;
      if (i>1 && db[i]>db[pk]) pk=i;
    }
    return { db:db, peakF:pk*FS/N_SPEC, peakDb:db[pk] };
  }

  /* ---------- Çizim ---------- */
  var cT=document.getElementById('cTime'), cS=document.getElementById('cSpec');
  function colors(){ var cs=getComputedStyle(document.documentElement); function g(n){ return cs.getPropertyValue(n).trim(); } return { line:g('--line'), muted:g('--muted'), t1:g('--trace'), t2:g('--trace2'), ink:g('--ink') }; }
  function setup(c){
    var dpr=window.devicePixelRatio||1, w=c.clientWidth, h=c.clientHeight;
    if (c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){ c.width=Math.round(w*dpr); c.height=Math.round(h*dpr); }
    var g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
    return { g:g, w:w, h:h };
  }
  var L=46, R=10, T=10, B=24;
  function drawTime(y, v){
    var s=setup(cT), g=s.g, col=colors(), pw=s.w-L-R, ph=s.h-T-B, n=y.length, i, mx=0;
    for (i=0;i<n;i++){ var a=Math.abs(y[i]); if(a>mx) mx=a; }
    var ym=Math.max(0.1, Math.ceil(mx*1.12*10)/10);
    function Y(val){ return T+ph*(1-(val+ym)/(2*ym)); }
    g.font='11px "IBM Plex Mono", monospace'; g.textBaseline='middle'; g.textAlign='right';
    [-ym,-ym/2,0,ym/2,ym].forEach(function(tv){
      g.strokeStyle=col.line; g.lineWidth=tv===0?1.4:1; g.globalAlpha=tv===0?1:0.55;
      g.beginPath(); g.moveTo(L,Math.round(Y(tv))+0.5); g.lineTo(L+pw,Math.round(Y(tv))+0.5); g.stroke(); g.globalAlpha=1;
      g.fillStyle=col.muted; g.fillText(trim(tv.toFixed(2)), L-6, Y(tv));
    });
    g.textAlign='center'; g.textBaseline='top';
    for (i=0;i<=4;i++){
      var xx=L+pw*i/4; g.strokeStyle=col.line; g.globalAlpha=0.55; g.beginPath(); g.moveTo(Math.round(xx)+0.5,T); g.lineTo(Math.round(xx)+0.5,T+ph); g.stroke(); g.globalAlpha=1;
      g.fillStyle=col.muted; g.textAlign=i===0?'left':(i===4?'right':'center'); g.fillText(fmtT(v.dur*i/4), xx, T+ph+6);
    }
    g.strokeStyle=col.t1; g.lineWidth=2; g.lineJoin='round'; g.beginPath();
    if (n>pw*2){
      g.lineWidth=1.4;
      for (var px=0;px<pw;px++){
        var i0=Math.floor(px/pw*n), i1=Math.max(i0+1,Math.floor((px+1)/pw*n)), lo=1e9, hi=-1e9;
        for (var k=i0;k<i1&&k<n;k++){ if(y[k]<lo) lo=y[k]; if(y[k]>hi) hi=y[k]; }
        g.moveTo(L+px+0.5,Y(hi)); g.lineTo(L+px+0.5,Y(lo)+0.5);
      }
    } else {
      for (i=0;i<n;i++){ var X=L+pw*i/(n-1); if(i===0) g.moveTo(X,Y(y[i])); else g.lineTo(X,Y(y[i])); }
    }
    g.stroke();
  }
  function drawSpec(sp){
    var s=setup(cS), g=s.g, col=colors(), pw=s.w-L-R, ph=s.h-T-B, db=sp.db, half=db.length-1, binW=FS/N_SPEC, fmax=FS/2, fmin=10;
    var top=Math.ceil((sp.peakDb+3)/10)*10, bot=Math.max(top-90,-150);
    if (top<-80){ top=0; bot=-90; }
    function Y(d){ return T+ph*(1-(clamp(d,bot,top)-bot)/(top-bot)); }
    function fx(px){ return P.log ? fmin*Math.pow(fmax/fmin,px/pw) : fmax*px/pw; }
    function px(f){ return P.log ? pw*Math.log(f/fmin)/Math.log(fmax/fmin) : pw*f/fmax; }
    g.font='11px "IBM Plex Mono", monospace'; g.textBaseline='middle'; g.textAlign='right';
    for (var d=Math.ceil(bot/20)*20; d<=top; d+=20){
      g.strokeStyle=col.line; g.globalAlpha=0.55; g.lineWidth=1; g.beginPath(); g.moveTo(L,Math.round(Y(d))+0.5); g.lineTo(L+pw,Math.round(Y(d))+0.5); g.stroke(); g.globalAlpha=1;
      g.fillStyle=col.muted; g.fillText(d+' dB', L-6, Y(d));
    }
    var ticks=P.log ? [10,100,1000,10000] : [0,5000,10000,15000,20000];
    g.textBaseline='top';
    ticks.forEach(function(f){
      var xx=L+px(f); g.strokeStyle=col.line; g.globalAlpha=0.55; g.beginPath(); g.moveTo(Math.round(xx)+0.5,T); g.lineTo(Math.round(xx)+0.5,T+ph); g.stroke(); g.globalAlpha=1;
      g.fillStyle=col.muted; g.textAlign=f===ticks[0]&&!P.log?'left':'center'; g.fillText(f>=1000?(f/1000)+'k':f, xx, T+ph+6);
    });
    g.beginPath(); g.moveTo(L,T+ph);
    var lastX=L;
    for (var c=0;c<pw;c++){
      var k0=Math.max(1,Math.floor(fx(c)/binW)), k1=Math.max(k0,Math.ceil(fx(c+1)/binW)), m=-300;
      for (var k=k0;k<=k1&&k<=half;k++) if(db[k]>m) m=db[k];
      g.lineTo(L+c+0.5,Y(m)); lastX=L+c+0.5;
    }
    g.lineTo(lastX,T+ph); g.closePath();
    g.fillStyle=col.t2; g.globalAlpha=0.18; g.fill(); g.globalAlpha=1;
    g.beginPath();
    for (c=0;c<pw;c++){
      var q0=Math.max(1,Math.floor(fx(c)/binW)), q1=Math.max(q0,Math.ceil(fx(c+1)/binW)), mm=-300;
      for (var kk=q0;kk<=q1&&kk<=half;kk++) if(db[kk]>mm) mm=db[kk];
      if(c===0) g.moveTo(L+c+0.5,Y(mm)); else g.lineTo(L+c+0.5,Y(mm));
    }
    g.strokeStyle=col.t2; g.lineWidth=1.6; g.lineJoin='round'; g.stroke();
  }

  /* ---------- Ayar arayüzü ---------- */
  var elTypes=document.getElementById('types'), elPresets=document.getElementById('presets'), elControls=document.getElementById('controls');
  var rows={}, fmtVal={};
  function pct(v){ return Math.round(v*100)+' %'; }
  var SL=[
    {k:'genlik',l:'Genlik',min:0.05,max:1,step:0.01,fmt:function(v){return v.toFixed(2);}},
    {k:'ofset',l:'DC ofset',min:-1,max:1,step:0.05,fmt:function(v){return v.toFixed(2);}},
    {k:'faz',l:'Faz',min:0,max:360,step:1,fmt:function(v){return v+'°';},show:function(t){return t!=='gurultu';}},
    {k:'duty',l:'Görev oranı',min:0.05,max:0.95,step:0.01,fmt:pct,show:function(t){return t==='kare'||t==='darbe';}},
    {k:'f2',l:'Bitiş frekansı',log:true,min:20,max:20000,fmt:fmtHz,show:function(t){return t==='chirp';}},
    {k:'sure',l:'Tarama süresi',min:0.1,max:2,step:0.05,fmt:function(v){return v.toFixed(2)+' sn';},show:function(t){return t==='chirp';}},
    {k:'modf',l:'Modülasyon frekansı',min:1,max:200,step:1,fmt:fmtHz,show:function(t){return t==='am'||t==='fm';}},
    {k:'derinlik',l:'Modülasyon derinliği',min:0,max:1,step:0.05,fmt:pct,show:function(t){return t==='am';}},
    {k:'beta',l:'FM indeksi (β)',min:0.5,max:20,step:0.5,fmt:function(v){return v.toFixed(1);},show:function(t){return t==='fm';}}
  ];
  function logToPos(v,min,max){ return 1000*Math.log(v/min)/Math.log(max/min); }
  function posToLog(p,min,max){ return min*Math.pow(max/min,p/1000); }

  TYPES.forEach(function(t){
    var b=document.createElement('button'); b.className='chip'; b.type='button'; b.setAttribute('role','radio'); b.dataset.t=t[0]; b.textContent=t[1];
    b.addEventListener('click',function(){ P.tur=t[0]; if(P.tur==='chirp'&&P.f>=P.f2) P.f=200; refresh(true); });
    elTypes.appendChild(b);
  });
  PRESETS.forEach(function(p){
    var b=document.createElement('button'); b.className='chip preset'; b.type='button'; b.innerHTML='<b>'+p[1]+'</b>'+p[2];
    b.addEventListener('click',function(){ P.f=p[0]; if(P.tur==='gurultu') P.tur='sinus'; refresh(true); });
    elPresets.appendChild(b);
  });

  // Frekans satırı
  (function(){
    var row=document.createElement('div'); row.className='row';
    row.innerHTML='<div class="row-h"><span class="lbl" id="fLbl">Frekans</span><span class="fnum"><input id="fNum" type="number" inputmode="decimal" min="1" max="20000" step="any" aria-labelledby="fLbl"><span class="val">Hz</span></span></div><input id="fRange" type="range" min="0" max="1000" step="1" aria-label="Frekans (logaritmik)">';
    elControls.appendChild(row); rows.f=row;
    var num=row.querySelector('#fNum'), rg=row.querySelector('#fRange');
    rg.addEventListener('input',function(){ P.f=Math.round(posToLog(+rg.value,1,20000)*100)/100; num.value=trim(P.f.toFixed(2)); changed(); });
    num.addEventListener('input',function(){ var v=parseFloat(num.value); if(isFinite(v)&&v>=1){ P.f=clamp(v,1,20000); rg.value=logToPos(P.f,1,20000); changed(); } });
    num.addEventListener('change',function(){ num.value=trim(P.f.toFixed(2)); });
  })();

  SL.forEach(function(c){
    var row=document.createElement('div'); row.className='row'; row.dataset.k=c.k;
    var id='s_'+c.k;
    row.innerHTML='<div class="row-h"><label for="'+id+'">'+c.l+'</label><span class="val" id="v_'+c.k+'"></span></div>'+
      '<input type="range" id="'+id+'" min="'+(c.log?0:c.min)+'" max="'+(c.log?1000:c.max)+'" step="'+(c.log?1:c.step)+'">';
    elControls.appendChild(row); rows[c.k]=row;
    var inp=row.querySelector('input');
    inp.addEventListener('input',function(){ P[c.k]=c.log?posToLog(+inp.value,c.min,c.max):+inp.value; document.getElementById('v_'+c.k).textContent=c.fmt(P[c.k]); changed(); });
  });

  // Gürültü ekleme
  (function(){
    var row=document.createElement('div'); row.className='row'; rows.snr=row;
    row.innerHTML='<label class="check"><input type="checkbox" id="snrOn"> Beyaz gürültü ekle</label>'+
      '<div id="snrBox" hidden><div class="row-h"><label for="snrR">Sinyal/gürültü oranı</label><span class="val" id="snrV"></span></div><input type="range" id="snrR" min="0" max="40" step="1"></div>';
    elControls.appendChild(row);
    var on=row.querySelector('#snrOn'), box=row.querySelector('#snrBox'), r=row.querySelector('#snrR'), v=row.querySelector('#snrV');
    on.addEventListener('change',function(){ P.snrOn=on.checked; box.hidden=!P.snrOn; changed(); });
    r.addEventListener('input',function(){ P.snr=+r.value; v.textContent=P.snr+' dB'; changed(); });
  })();

  function refresh(redraw){
    Array.prototype.forEach.call(elTypes.children,function(b){ b.setAttribute('aria-checked', b.dataset.t===P.tur?'true':'false'); });
    var noise=P.tur==='gurultu';
    rows.f.hidden=noise; elPresets.hidden=noise;
    document.getElementById('fLbl').textContent=(P.tur==='am'||P.tur==='fm')?'Taşıyıcı frekans':(P.tur==='chirp'?'Başlangıç frekansı':'Frekans');
    document.getElementById('fNum').value=trim(P.f.toFixed(2));
    document.getElementById('fRange').value=logToPos(P.f,1,20000);
    SL.forEach(function(c){
      var show=!c.show||c.show(P.tur); rows[c.k].hidden=!show;
      var inp=rows[c.k].querySelector('input');
      inp.value=c.log?logToPos(P[c.k],c.min,c.max):P[c.k];
      document.getElementById('v_'+c.k).textContent=c.fmt(P[c.k]);
    });
    rows.snr.hidden=noise;
    document.getElementById('snrV').textContent=P.snr+' dB';
    if (redraw) changed();
  }

  /* ---------- Güncelleme ---------- */
  var pending=false, audioTimer=null;
  function changed(){
    if (!pending){ pending=true; requestAnimationFrame(function(){ pending=false; paint(); }); }
    if (playing){ clearTimeout(audioTimer); audioTimer=setTimeout(swapAudio,120); }
  }
  function paint(){
    var v=view(), y=gen(v.n,v.fs,1,false), i, sum=0, sq=0, mn=1e9, mxv=-1e9;
    for (i=0;i<y.length;i++){ sum+=y[i]; sq+=y[i]*y[i]; if(y[i]<mn) mn=y[i]; if(y[i]>mxv) mxv=y[i]; }
    var mean=sum/y.length, rms=Math.sqrt(sq/y.length);
    var per=(P.tur==='sinus'||P.tur==='kare'||P.tur==='ucgen'||P.tur==='testere'||P.tur==='darbe')?'<span>Periyot <b>'+fmtT(1/P.f)+'</b></span>':'';
    document.getElementById('stats').innerHTML='<span>RMS <b>'+rms.toFixed(3)+'</b></span><span>Ort. <b>'+mean.toFixed(3)+'</b></span><span>Tepe-tepe <b>'+(mxv-mn).toFixed(3)+'</b></span>'+per;
    document.getElementById('viewInfo').textContent=fmtT(v.dur)+' gösteriliyor';
    drawTime(y,v);
    var sp=spectrum();
    document.getElementById('specStats').innerHTML='<span>Tepe <b>≈ '+fmtHz(sp.peakF)+'</b></span><span><b>'+sp.peakDb.toFixed(1)+' dB</b></span><span>Çözünürlük <b>'+(FS/N_SPEC).toFixed(2)+' Hz</b></span>';
    drawSpec(sp);
  }
  document.getElementById('axLog').addEventListener('click',function(){ P.log=true; syncAx(); paint(); });
  document.getElementById('axLin').addEventListener('click',function(){ P.log=false; syncAx(); paint(); });
  function syncAx(){ document.getElementById('axLog').setAttribute('aria-pressed',P.log); document.getElementById('axLin').setAttribute('aria-pressed',!P.log); }

  /* ---------- Ses ---------- */
  var ctx=null, gainN=null, src=null, playing=false, btn=document.getElementById('play');
  function ensure(){
    if (!ctx){ var AC=window.AudioContext||window.webkitAudioContext; ctx=new AC(); gainN=ctx.createGain(); gainN.gain.value=0; gainN.connect(ctx.destination); }
    if (ctx.state==='suspended') ctx.resume();
  }
  function buildBuffer(){
    var fs=ctx.sampleRate, n;
    if (P.tur==='gurultu') n=2*fs;
    else if (P.tur==='chirp') n=Math.round(P.sure*fs);
    else if (P.tur==='am'||P.tur==='fm') n=Math.round(Math.max(1,Math.round(P.modf))*fs/P.modf);
    else n=Math.round(Math.max(1,Math.round(P.f))*fs/P.f);
    var x=gen(n,fs,7,true); for (var i=0;i<n;i++) x[i]=clamp(x[i],-1,1);
    var buf=ctx.createBuffer(1,n,fs); buf.copyToChannel(x,0); return buf;
  }
  function startSrc(){
    var s=ctx.createBufferSource(); s.buffer=buildBuffer(); s.loop=true; s.connect(gainN); s.start(); return s;
  }
  function swapAudio(){ if(!playing) return; var old=src; src=startSrc(); if(old){ try{ old.stop(ctx.currentTime+0.01); }catch(e){} } }
  function setPlaying(on){
    playing=on; btn.textContent=on?'Durdur':'Çal'; btn.setAttribute('aria-pressed',on);
  }
  btn.addEventListener('click',function(){
    if (!playing){
      try { ensure(); src=startSrc(); gainN.gain.cancelScheduledValues(ctx.currentTime); gainN.gain.setTargetAtTime(P.vol,ctx.currentTime,0.02); setPlaying(true); say('Çalıyor. Ayarları değiştirince ses de güncellenir.'); }
      catch(e){ say('Bu tarayıcıda ses başlatılamadı.'); }
    } else {
      gainN.gain.setTargetAtTime(0,ctx.currentTime,0.02);
      var s=src; setTimeout(function(){ try{ s.stop(); }catch(e){} },120); src=null; setPlaying(false); say('Durduruldu.');
    }
  });
  document.getElementById('vol').addEventListener('input',function(e){ P.vol=+e.target.value; if(playing) gainN.gain.setTargetAtTime(P.vol,ctx.currentTime,0.02); });
  document.addEventListener('visibilitychange',function(){ if(document.hidden&&playing){ btn.click(); } });

  /* ---------- CSV ---------- */
  var msgT=null; function say(t){ var m=document.getElementById('msg'); m.textContent=t; }
  document.getElementById('copy').addEventListener('click',function(){
    var v=view(), y=gen(v.n,v.fs,1,false), s='zaman_s,genlik\n', i;
    for (i=0;i<y.length;i++) s+=(i/v.fs).toPrecision(7)+','+y[i].toFixed(6)+'\n';
    var ta=document.getElementById('csvOut');
    function fallback(){ ta.hidden=false; ta.value=s; ta.focus(); ta.select(); say('Panoya yazılamadı. Metin seçildi, elle kopyalayabilirsin.'); }
    if (navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(s).then(function(){ ta.hidden=true; say('CSV panoya kopyalandı ('+y.length+' satır, '+fmtT(v.dur)+').'); },fallback);
    } else fallback();
  });

  /* ---------- Başlangıç ---------- */
  refresh(false); syncAx(); paint();
  if (window.ResizeObserver){ var ro=new ResizeObserver(function(){ paint(); }); ro.observe(cT); ro.observe(cS); }
  else window.addEventListener('resize',paint);
  if (document.fonts&&document.fonts.ready) document.fonts.ready.then(paint);
  new MutationObserver(paint).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paint);
})();
</script>

</body>
