name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk sinyal-ureteci.apk

      - name: Sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum sinyal-ureteci.apk \
            --title "Sinyal Üreteci" \
            --notes "Android APK. İndirip telefona kurabilirsin."

      - uses: actions/upload-artifact@v4
        with:
          name: sinyal-ureteci-apk
          path: sinyal-ureteci.apk
